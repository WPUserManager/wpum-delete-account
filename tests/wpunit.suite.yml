bootstrap: _bootstrap.php
actor: WpunitTester
modules:
    enabled:
        - WPLoader
        - \Helper\Wpunit
    config:
        WPLoader:
            wpRootFolder: "%WP_ROOT_FOLDER%"
            dbName: "%TEST_DB_NAME%"
            dbHost: "%TEST_DB_HOST%"
            dbUser: "%TEST_DB_USER%"
            dbPassword: "%TEST_DB_PASSWORD%"
            tablePrefix: "%TEST_TABLE_PREFIX%"
            domain: "%TEST_SITE_WP_DOMAIN%"
            adminEmail: "%TEST_SITE_ADMIN_EMAIL%"
            title: "WP Test"
            plugins:
                - wp-user-manager/wp-user-manager.php
                - wpum-delete-account/wpum-delete-account.php
            wpDebug: false
            isolatedInstall: false
            configFile: tests/wpunit/create-wpum-tables.php
